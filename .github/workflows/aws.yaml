name: Deploy to ECS Fargate

# Manual only: deploying creates billable AWS resources, so it is never a side
# effect of merging. Run it from the Actions tab (or `gh workflow run aws.yaml`).
# One-time AWS setup (CloudFormation stack, ECR repo, secret, deploy user):
# docs/deploy-aws.md
on:
  workflow_dispatch:

env:
  # Set the AWS_REGION repository variable to deploy elsewhere
  AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
  # Must match the names created by infrastructure/groundwork-ecs.yaml (ProjectName=groundwork)
  ECR_REPOSITORY: groundwork
  ECS_CLUSTER: groundwork-cluster
  ECS_SERVICE: groundwork-service
  TASK_FAMILY: groundwork
  CONTAINER_NAME: groundwork

permissions:
  contents: read

concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Require AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing+=(AWS_ACCESS_KEY_ID)
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing+=(AWS_SECRET_ACCESS_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

  tests:
    name: Unit tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build-and-push:
    name: Build & Push Docker Image
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS Fargate
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # CloudFormation owns the task definition (roles, secret, logs). Start from the
      # latest registered revision and only swap the image, so no account ids live here.
      - name: Download current task definition
        run: |
          # drop the read-only fields describe returns but register rejects
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)' > task-definition.json

      - name: Render Task Definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
