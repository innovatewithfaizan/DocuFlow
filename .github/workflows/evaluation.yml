name: RAG evaluation

# See evaluation/README.md.
# - Retrieval runs on every PR that touches evaluation/, with local embeddings: free, no keys.
# - Answer faithfulness calls paid APIs, so it only runs when started by hand
#   (Actions > RAG evaluation > Run workflow) and only if OPENAI_API_KEY is configured.
on:
  workflow_dispatch:
    inputs:
      answers:
        description: "Also generate and judge answers (uses OPENAI_API_KEY, ~US$0.25 per run)"
        type: boolean
        default: true
      judge_model:
        description: "OpenAI model used as the judge"
        default: "gpt-4.1"
  pull_request:
    paths:
      - "evaluation/**"
      - "!evaluation/results/**"
      - ".github/workflows/evaluation.yml"

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r evaluation/requirements.txt

      - name: Retrieval, local embeddings (bge-small)
        run: python -m evaluation.run_eval --embeddings fastembed --retrieval-only

      - name: Retrieval and answers, OpenAI
        if: github.event_name == 'workflow_dispatch' && inputs.answers && env.HAS_OPENAI_KEY == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python -m evaluation.run_eval --embeddings openai --llm openai
          --judge-provider openai --judge-model "${{ inputs.judge_model }}"

      - name: Explain skipped answers step
        if: github.event_name == 'workflow_dispatch' && inputs.answers && env.HAS_OPENAI_KEY != 'true'
        run: echo "::warning::Answers were not evaluated; add an OPENAI_API_KEY repository secret and re-run."

      - name: Job summary
        if: always()
        run: cat evaluation/results/*.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: evaluation/results/
