name: RAG evaluation

# Retrieval hit rate and answer faithfulness on a public paper (evaluation/README.md).
# Runs on GitHub Models with the workflow's own token: no API keys or secrets.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evaluation/**"
      - "!evaluation/results/**"
      - ".github/workflows/evaluation.yml"

permissions:
  contents: read
  models: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r evaluation/requirements.txt

      - name: Retrieval, local embeddings (bge-small, no API)
        run: python -m evaluation.run_eval --embeddings fastembed --retrieval-only

      - name: Check GitHub Models access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          probe() {
            code=$(curl -sS -o body.json -w "%{http_code} %{content_type}" -X POST \
              "https://models.github.ai/inference/$1" \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$2")
            echo "$1 -> $code"; head -c 300 body.json; echo
            case "$code" in 200\ application/json*) ;; *) return 1 ;; esac
          }
          probe embeddings '{"model":"openai/text-embedding-3-small","input":["probe"]}'
          probe chat/completions '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Reply OK"}],"max_tokens":3}'

      - name: Retrieval and answers, GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # free tier allows ~15 requests/minute, hence the spacing
        run: >-
          python -m evaluation.run_eval --embeddings github --llm github
          --judge-provider github --judge-model openai/gpt-4o --min-interval 4.5

      - name: Job summary
        if: always()
        run: cat evaluation/results/*.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: evaluation/results/
