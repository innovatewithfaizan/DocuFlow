faiss_db:
  collection_name: "docuflow"

embedding_model:
  # openai | google. Override per process with EMBEDDING_PROVIDER.
  # An index must be queried with the same embedding model it was built with.
  provider: "openai"
  model_name: "text-embedding-3-small"
  google_model_name: "models/gemini-embedding-001"

retriever:
  top_k: 10

# Used when LLM_PROVIDER is not set
default_llm: "openai"

llm:
  groq:
    provider: "groq"
    model_name: "openai/gpt-oss-120b"
    temperature: 0
    max_output_tokens: 2048

  google:
    provider: "google"
    model_name: "gemini-2.5-flash"
    temperature: 0
    max_output_tokens: 2048

  openai:
    provider: "openai"
    model_name: "gpt-4o"
    temperature: 0
    max_output_tokens: 1000
